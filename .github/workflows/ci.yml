name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: dg, POSTGRES_PASSWORD: dg_ci, POSTGRES_DB: dg_pm }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dg" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dg:dg_ci@localhost:5432/dg_pm?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
