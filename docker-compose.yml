# Local development services. Bound to 127.0.0.1 only.
services:
  db:
    image: postgres:16-alpine
    container_name: dg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dg
      POSTGRES_PASSWORD: dg_local_dev
      POSTGRES_DB: dg_pm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dg -d dg_pm"]
      interval: 5s
      retries: 10
volumes:
  dg-pgdata:
