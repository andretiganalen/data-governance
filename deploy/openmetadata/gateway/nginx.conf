# dev-data.len.co.id → landing page (/) + OpenMetadata (everything else)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Resolve at request time so the gateway (and landing page) runs even while OpenMetadata is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80 default_server;
  listen 8585;
  server_name 192.168.125.14 dev-data.len.co.id;
  client_max_body_size 50m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Landing page (exact root only)
  location = / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }
  location /_landing/ {
    alias /usr/share/nginx/html/_landing/;
    expires 1h;
  }
  # LenO theme — plan/leno_interface_theme.md (colour & position reference)
  location /_leno/ {
    alias /usr/share/nginx/leno/;
    add_header Cache-Control "no-cache";
  }
  error_page 502 503 504 /_landing/starting.html;
  location = /_gateway/health { return 200 "ok\n"; add_header Content-Type text/plain; }

  # OpenMetadata UI + API + websocket push
  location / {
    set $om_upstream http://openmetadata-server:8585;
    proxy_pass $om_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";   # uncompressed HTML so sub_filter can inject the theme
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/_leno/leno.css"></head>';
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
