# dev-data.len.co.id → landing page (/) + Len Data Governance (everything else)
# Data: semua dibaca dari Trino lakehouse (Visualisasi, katalog). Panel unduhan berkas /unduh/ ditutup 2026-11-10.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Resolve at request time so the gateway (and landing page) runs even while the app server is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80 default_server;
  listen 8585;
  server_name 192.168.125.14 dev-data.len.co.id;
  client_max_body_size 50m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Landing page (exact root only)
  location = / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }
  location /_landing/ {
    alias /usr/share/nginx/html/_landing/;
    expires 1h;
  }
  # Tema UIx — plan/interface-menu.md
  location /_leno/ {
    alias /usr/share/nginx/leno/;
    add_header Cache-Control "no-cache";
  }
  error_page 502 503 504 /_landing/starting.html;
  # Menu "Visualisasi" di Len Data Governance → Superset 6 (Gold dari Trino lakehouse) pada origin yang sama.
  # Superset berjalan dengan SUPERSET_APP_ROOT=/visualisasi; port 8088 tidak dibuka ke luar.
  location = /visualisasi { return 301 /visualisasi/; }
  location /visualisasi/ {
    set $superset_upstream http://superset:8088;
    proxy_pass $superset_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";   # HTML tanpa kompresi agar tema LenO bisa disisipkan
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/_leno/leno-superset.css"><script src="/_leno/leno-superset.js"></script></head>';
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  # Referensi (CLP-001, CLP-002, ...) — berkas berversi "YYMMDD CC Nama.ext" di data/referensi (di luar git).
  # Hanya untuk pengguna yang sudah login: token sesi (cookie dg_token) diperiksa ke API sebelum berkas dilayani.
  location = /referensi { return 301 /referensi/; }
  location = /referensi/ { alias /usr/share/nginx/leno/; try_files /referensi.html =404; add_header Cache-Control "no-cache"; }
  location /referensi/berkas/ {
    auth_request /_auth_referensi;
    alias /usr/share/nginx/referensi/;
    autoindex on; autoindex_format json;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "attachment";
  }
  location = /_auth_referensi {
    internal;
    set $ldg_upstream http://ldg-server:8585;
    proxy_pass $ldg_upstream/api/v1/users/loggedInUser;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "Bearer $cookie_dg_token";
  }
  location = /_gateway/health { return 200 "ok\n"; add_header Content-Type text/plain; }

  # Brand name: the upstream catalog UI 2.0.7 has no Settings field for it — the UI's i18n default {{brandName}}
  # is rewritten here (main bundle + PWA manifest); remaining upstream product names in UI text are rewritten
  # in the browser by /_leno/leno-menu.js.
  location ~ ^/assets/index-[^/]+\.js$ {
    set $ldg_upstream http://ldg-server:8585;
    proxy_pass $ldg_upstream;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/javascript text/javascript;
    sub_filter_once on;
    sub_filter 'brandName:"OpenMetadata"' 'brandName:"Len Data Governance"';
    add_header Cache-Control "no-cache";
  }
  location = /manifest.json {
    set $ldg_upstream http://ldg-server:8585;
    proxy_pass $ldg_upstream;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json application/manifest+json;
    sub_filter_once on;
    sub_filter '"OpenMetadata Application"' '"Len Data Governance"';
  }

  # Len Data Governance UI + API + websocket push
  location / {
    set $ldg_upstream http://ldg-server:8585;
    proxy_pass $ldg_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";   # uncompressed HTML so sub_filter can inject the theme
    sub_filter_once off;
    sub_filter '<head>' '<head><script src="/_leno/leno-menu.js"></script>';   # paling awal: token sesi tertangkap sejak panggilan API pertama
    sub_filter '</head>' '<link rel="stylesheet" href="/_leno/leno.css"></head>';
    sub_filter '<title>OpenMetadata</title>' '<title>Len Data Governance</title>';
    sub_filter 'content="OpenMetadata Application"' 'content="Len Data Governance"';
    sub_filter 'content="OpenMetadata"' 'content="Len Data Governance"';
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

