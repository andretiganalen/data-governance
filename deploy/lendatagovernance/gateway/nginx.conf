# dev-data.len.co.id → landing page (/) + Len Data Governance (everything else)
# Data: semua dibaca dari Trino lakehouse (Visualisasi, katalog). Panel unduhan berkas /unduh/ ditutup 2026-11-10.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Cookie > 5000 karakter (tumpukan cookie aplikasi lain di IP yang sama) dibuang sebelum ke ldg-server: Jetty menolaknya dengan 431 (batas header 8 KiB).
# Aplikasi memakai token Bearer, bukan cookie, jadi tidak ada fungsi yang hilang.
map $http_cookie $ldg_cookie { default $http_cookie; "~^.{5000,}$" ""; }

# Tempat Sampah (2026-11-11): pengguna tidak boleh menghapus permanen. Setiap DELETE dari klien jaringan dengan hardDelete=true
# diubah menjadi hardDelete=false (soft delete: tersimpan di Tempat Sampah 20 hari, bisa dipulihkan; pembersihan otomatis oleh
# timer lendatagovernance-trash). Hanya server sendiri (loader + pembersih) yang boleh menghapus permanen.
# 127.0.0.1 dan 172.28.11.1 (gerbang bridge Docker) = akses dari server ini; klien LAN muncul dengan IP aslinya.
geo $ldg_internal { default 0; 127.0.0.1 1; 172.28.11.1 1; }
# Huruf besar/kecil diabaikan (~*), dua kemunculan diganti (parameter ganda), dan query ter-encode (%..) dari klien jaringan ditolak 400
# karena hard%44elete=true dst. lolos dari pencocokan teks.
map "$request_method:$ldg_internal:$request_uri" $ldg_api_uri1 {
  "~*^DELETE:0:(?<a>.*?)hardDelete=true(?<b>.*)$" "${a}hardDelete=false${b}";
  default $request_uri;
}
map "$request_method:$ldg_internal:$ldg_api_uri1" $ldg_api_uri {
  "~*^DELETE:0:(?<a>.*?)hardDelete=true(?<b>.*)$" "${a}hardDelete=false${b}";
  default $ldg_api_uri1;
}
map "$request_method:$ldg_internal:$ldg_api_uri" $ldg_api_block {
  "~*^DELETE:0:[^?]*\?.*(%|hardDelete=true)" 1;
  default 0;
}

# Resolve at request time so the gateway (and landing page) runs even while the app server is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  # Cookie semua aplikasi di IP yang sama (port berbeda) dibagi satu wadah; batas bawaan 8k memicu 400 "Request Header Or Cookie Too Large"
  large_client_header_buffers 4 32k;
  listen 80 default_server;
  listen 8585;
  server_name 192.168.125.14 dev-data.len.co.id;
  client_max_body_size 50m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Landing page (exact root only)
  location = / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }
  location /_landing/ {
    alias /usr/share/nginx/html/_landing/;
    expires 1h;
  }
  # Tema UIx — plan/interface-menu.md
  location /_leno/ {
    alias /usr/share/nginx/leno/;
    add_header Cache-Control "no-cache";
  }
  # Merek (hardcoded): logo Len Holding of DEFEND ID. Konfigurasi tema publik dilayani tetap dari berkas, sehingga logo bawaan
  # upstream tidak pernah muncul lagi (endpoint aslinya mengembalikan URL logo kosong untuk pengguna belum login).
  location = /api/v1/system/config/customUiThemePreference {
    limit_except GET { deny all; }
    default_type application/json;
    add_header Cache-Control "no-cache";
    alias /usr/share/nginx/leno/brand/theme.json;
  }
  location = /favicon.png { alias /usr/share/nginx/leno/brand/len-favicon.png; add_header Cache-Control "no-cache"; }
  error_page 502 503 504 /_landing/starting.html;
  # Menu "Visualisasi" di Len Data Governance → Superset 6 (Gold dari Trino lakehouse) pada origin yang sama.
  # Superset berjalan dengan SUPERSET_APP_ROOT=/visualisasi; port 8088 tidak dibuka ke luar.
  location = /visualisasi { return 301 /visualisasi/; }
  location /visualisasi/ {
    set $superset_upstream http://superset:8088;
    proxy_pass $superset_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";   # HTML tanpa kompresi agar tema LenO bisa disisipkan
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/_leno/leno-superset.css"><script src="/_leno/leno-superset.js"></script></head>';
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  # Referensi (CLP-001, CLP-002, ...) — berkas berversi "YYMMDD CC Nama.ext" di data/referensi (di luar git).
  # Hanya untuk pengguna yang sudah login: token sesi (cookie dg_token) diperiksa ke API sebelum berkas dilayani.
  location = /referensi { return 301 /referensi/; }
  location = /referensi/ { alias /usr/share/nginx/leno/; try_files /referensi.html =404; add_header Cache-Control "no-cache"; }
  location /referensi/berkas/ {
    auth_request /_auth_referensi;
    alias /usr/share/nginx/referensi/;
    autoindex on; autoindex_format json;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "attachment";
  }
  location = /_auth_referensi {
    internal;
    set $ldg_upstream http://ldg-server:8585;
    proxy_pass $ldg_upstream/api/v1/users/loggedInUser;
    proxy_set_header Cookie $ldg_cookie;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "Bearer $cookie_dg_token";
  }
  # Unduh Excel hasil Data Governance: layanan ldg-export memvalidasi token sesi ke ldg-server dan membatasi isi sesuai hak akses
  location /_export/ {
    set $ldg_export http://ldg-export:8590;
    proxy_pass $ldg_export;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_set_header Authorization $http_authorization;
  }

  location = /_gateway/health { return 200 "ok\n"; add_header Content-Type text/plain; }

  # Brand name: the upstream catalog UI 2.0.7 has no Settings field for it — the UI's i18n default {{brandName}}
  # is rewritten here (main bundle + PWA manifest); remaining upstream product names in UI text are rewritten
  # in the browser by /_leno/leno-menu.js.
  location ~ ^/assets/index-[^/]+\.js$ {
    set $ldg_upstream http://ldg-server:8585;
    proxy_pass $ldg_upstream;
    proxy_set_header Cookie $ldg_cookie;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/javascript text/javascript;
    sub_filter_once on;
    sub_filter 'brandName:"OpenMetadata"' 'brandName:"Len Data Governance"';
    # Bahasa Indonesia (ID): daftar bahasa + pemuat modul terjemahan /_leno/i18n/id-id.js (dibangun dari i18n/id-id.json)
    sub_filter 'e.English="en-US",' 'e.English="en-US",e["Bahasa Indonesia"]="id-ID",';   # urutan ke-2, tepat di bawah English
    sub_filter 'sv:ee.Svenska}' 'sv:ee.Svenska,id:ee["Bahasa Indonesia"]}';
    # Domain = Fungsi (2026-11-13): teks English berkunci "domain" diganti "Fungsi" saat en-US dimuat (i18n/en-fungsi.js).
    # Satu aturan saja: dua aturan sub_filter yang saling tumpang tindih tidak jalan bersamaan.
    sub_filter 'N3={"en-US":()=>R(()=>Promise.resolve().then(()=>_3),void 0,import.meta.url)' 'N3={"id-ID":()=>R(()=>import("/_leno/i18n/id-id.js"),[],import.meta.url),"en-US":()=>R(()=>Promise.resolve().then(()=>_3),void 0,import.meta.url).then(m=>import("/_leno/i18n/en-fungsi.js").then(o=>o.apply(m)))';
    add_header Cache-Control "no-cache";
  }
  location = /manifest.json {
    set $ldg_upstream http://ldg-server:8585;
    proxy_pass $ldg_upstream;
    proxy_set_header Cookie $ldg_cookie;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json application/manifest+json;
    sub_filter_once on;
    sub_filter '"OpenMetadata Application"' '"Len Data Governance"';
  }

  # Penyimpanan berkas Documents (S3 internal, tanpa port publik): hanya unduh (GET/HEAD) lewat URL bertanda tangan (5 menit).
  # Host harus tetap ldg-storage:8333 karena ikut ditandatangani.
  location /_ldgstore/ {
    limit_except GET HEAD { deny all; }
    set $ldg_store http://ldg-storage:8333;
    rewrite ^/_ldgstore/(.*)$ /$1 break;
    proxy_pass $ldg_store;
    proxy_set_header Host ldg-storage:8333;
    proxy_http_version 1.1;
    proxy_buffering off;
  }

  # Len Data Governance UI + API + websocket push
  # API: sama seperti location / tetapi URI melewati aturan Tempat Sampah di atas
  location /api/ {
    if ($ldg_api_block) { return 400 "hardDelete tidak diizinkan dari klien jaringan\n"; }
    set $ldg_upstream http://ldg-server:8585;
    proxy_pass $ldg_upstream$ldg_api_uri;
    proxy_set_header Cookie $ldg_cookie;
    proxy_redirect http://ldg-storage:8333/ /_ldgstore/;   # unduhan Documents: server mengalihkan ke URL bertanda tangan di penyimpanan internal
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  location / {
    set $ldg_upstream http://ldg-server:8585;
    proxy_pass $ldg_upstream;
    proxy_set_header Cookie $ldg_cookie;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";   # uncompressed HTML so sub_filter can inject the theme
    sub_filter_once off;
    sub_filter '<head>' '<head><script src="/_leno/leno-i18n.js"></script><script src="/_leno/leno-docs.js"></script><script src="/_leno/leno-menu.js"></script><script src="/_leno/leno-trash.js" defer></script>';   # paling awal: token sesi tertangkap sejak panggilan API pertama
    sub_filter '</head>' '<link rel="stylesheet" href="/_leno/leno.css"></head>';
    sub_filter '<title>OpenMetadata</title>' '<title>Len Data Governance</title>';
    sub_filter 'content="OpenMetadata Application"' 'content="Len Data Governance"';
    sub_filter 'content="OpenMetadata"' 'content="Len Data Governance"';
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

