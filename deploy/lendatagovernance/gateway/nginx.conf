# dev-data.len.co.id → landing page (/) + OpenMetadata (everything else)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Resolve at request time so the gateway (and landing page) runs even while OpenMetadata is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80 default_server;
  listen 8585;
  server_name 192.168.125.14 dev-data.len.co.id;
  client_max_body_size 50m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Landing page (exact root only)
  location = / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }
  location /_landing/ {
    alias /usr/share/nginx/html/_landing/;
    expires 1h;
  }
  # LenO theme — plan/leno_interface_theme.md (colour & position reference)
  location /_leno/ {
    alias /usr/share/nginx/leno/;
    add_header Cache-Control "no-cache";
  }
  # Panel "Data Siap Pakai" (Gold, medallion/build_medallion.py). Login: scripts/panel-account.sh.
  # Only panel/ is mounted: bronze/silver (work/) stay on the server.
  location = /unduh { return 301 /unduh/; }
  location /unduh/ {
    alias /usr/share/nginx/unduh/;
    index index.html;
    auth_basic "Len Data Governance - Data Siap Pakai";
    auth_basic_user_file /etc/nginx/unduh.htpasswd;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    # E-GRC Gold (Confidential): separate accounts — a UV-1 panel login does NOT open these files.
    location ~ ^/unduh/rilis/[^/]+/grc/ {
      auth_basic "Len Data Governance - E-GRC (Confidential)";
      auth_basic_user_file /etc/nginx/unduh-grc.htpasswd;
      types { text/csv csv; application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx; }
      charset utf-8;
      add_header Cache-Control "no-store";
      add_header X-Content-Type-Options nosniff always;
    }
    location ~ \.csv$ { default_type "text/csv; charset=utf-8"; }
  }
  error_page 502 503 504 /_landing/starting.html;
  # Menu "Visualisasi" di OpenMetadata → Superset 6 (Gold dari Trino lakehouse) pada origin yang sama.
  # Superset berjalan dengan SUPERSET_APP_ROOT=/visualisasi; port 8088 tidak dibuka ke luar.
  location = /visualisasi { return 301 /visualisasi/; }
  location /visualisasi/ {
    set $superset_upstream http://superset:8088;
    proxy_pass $superset_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  location = /_gateway/health { return 200 "ok\n"; add_header Content-Type text/plain; }

  # Brand name: OpenMetadata 2.0.7 has no Settings field for it — the UI's i18n default {{brandName}}
  # is rewritten here (main bundle + PWA manifest). Remove these two blocks to restore "OpenMetadata".
  location ~ ^/assets/index-[^/]+\.js$ {
    set $om_upstream http://openmetadata-server:8585;
    proxy_pass $om_upstream;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/javascript text/javascript;
    sub_filter_once on;
    sub_filter 'brandName:"OpenMetadata"' 'brandName:"Len Data Governance"';
    add_header Cache-Control "no-cache";
  }
  location = /manifest.json {
    set $om_upstream http://openmetadata-server:8585;
    proxy_pass $om_upstream;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json application/manifest+json;
    sub_filter_once on;
    sub_filter '"OpenMetadata Application"' '"Len Data Governance"';
  }

  # OpenMetadata UI + API + websocket push
  location / {
    set $om_upstream http://openmetadata-server:8585;
    proxy_pass $om_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";   # uncompressed HTML so sub_filter can inject the theme
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/_leno/leno.css"><script src="/_leno/leno-menu.js" defer></script></head>';
    sub_filter '<title>OpenMetadata</title>' '<title>Len Data Governance</title>';
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

