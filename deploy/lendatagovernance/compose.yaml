# Len Data Governance — dev-data.len.co.id (server jitsi 192.168.125.14)
# Plan: plan/lendatagovernance_deployment_plan.md
# Data & secrets live OUTSIDE git in ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}.
# Business data lives only in the Trino lakehouse (lakekeeper @ datahub.len.co.id). Postgres and OpenSearch here hold
# only the platform's own internal state (catalog metadata, Superset metadata, search index).
# Upstream names that cannot change: the catalog server image (docker.getcollate.io/openmetadata/server:2.0.7), its
# in-image paths (/opt/openmetadata/conf, ./bootstrap/openmetadata-ops.sh) and its env-variable keys.
name: lendatagovernance

x-ldg-env: &ldg-env
  env_file:
    - ./lendatagovernance.base.env                       # non-secret settings (in git)
    - ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/secrets/lendatagovernance.env  # secrets + IDS (not in git)
    - ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/secrets/storage.env  # S3 keys for the file store (not in git)
  volumes:
    - ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/secrets/jwt:/opt/openmetadata/conf/jwt:ro   # path inside the upstream image

services:
  postgresql:
    image: postgres:15-bookworm
    restart: unless-stopped
    command: ["postgres", "-c", "work_mem=10MB", "-c", "max_connections=200"]
    env_file: [ "${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/secrets/postgres.env" ]
    volumes:
      - ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [ldg-internal]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lendatagovernance_db"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.4.0   # ≥ 3.4.0 wajib: 3.2–3.3 punya bug Lucene 10 (script_score di dis_max → NPE, pencarian HTTP 500)
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - cluster.name=ldg-cluster
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_SECURITY_PLUGIN=true          # internal network only
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/opensearch:/usr/share/opensearch/data
    networks: [ldg-internal]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20

  # File store for Context Center > Documents (the catalog only supports S3/Azure; there is no local-disk provider).
  # One container, internal network only (no published port), data in ${LDG_DATA_DIR}/storage (migrate = copy data/).
  ldg-storage:
    image: chrislusf/seaweedfs:3.85
    restart: unless-stopped
    command: ["server", "-dir=/data", "-ip=ldg-storage", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-s3.port=8333", "-filer", "-master.volumeSizeLimitMB=1024"]
    volumes:
      - ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/storage:/data
      - ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/secrets/storage-s3.json:/etc/seaweedfs/s3.json:ro
    networks: [ldg-internal]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://ldg-storage:8888/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  ldg-migrate:
    <<: *ldg-env
    image: docker.getcollate.io/openmetadata/server:2.0.7
    command: "./bootstrap/openmetadata-ops.sh migrate"
    depends_on:
      postgresql: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    networks: [ldg-internal]

  ldg-server:
    <<: *ldg-env
    image: docker.getcollate.io/openmetadata/server:2.0.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8586:8586"   # admin/health — localhost only (UI/API go through the gateway)
    depends_on:
      postgresql: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      ldg-storage: { condition: service_healthy }
      ldg-migrate: { condition: service_completed_successfully }
    networks: [ldg-internal, ldg-egress]   # egress needed to reach ids.len.co.id
    mem_limit: 2500m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 40

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"         # http://dev-data.len.co.id · http://192.168.125.14
      - "0.0.0.0:8585:8585"     # http://192.168.125.14:8585 — same gateway, so the LenO theme applies here too
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
      - ../ui/leno-theme:/usr/share/nginx/leno:ro
      - ../../data/referensi:/usr/share/nginx/referensi:ro   # berkas referensi berversi (CLP-001, CLP-002, ...)
    networks: [ldg-egress, ldg-internal]   # ldg-internal: hanya untuk meneruskan unduhan Documents ke ldg-storage
    mem_limit: 128m

  # Unduh Excel hasil Data Governance sesuai hak akses (kode: medallion/export_server.py). Hanya jaringan internal;
  # publik lewat gateway /_export/. Egress: Trino datahub.len.co.id:443. Memvalidasi token sesi ke ldg-server.
  ldg-export:
    build: ./export
    image: lendatagovernance/export:1
    restart: unless-stopped
    user: "${LDG_UID:-1003}:${LDG_UID:-1003}"   # trino.env bermode 600 milik pemilik data; izin berkas tidak dilonggarkan
    environment:
      LDG_DATA_DIR: /data
      LDG_UPSTREAM: http://ldg-server:8585
    volumes:
      - ./medallion:/app:ro
      - ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/secrets/trino.env:/data/secrets/trino.env:ro
      - ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/medallion/pdf_request:/data/medallion/pdf_request   # permintaan "Terbitkan Revisi PDF" + status
    depends_on:
      ldg-server: { condition: service_healthy }
    networks: [ldg-internal, ldg-egress]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8590/healthz',timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 10

  superset:
    build: ./superset
    image: lendatagovernance/superset:6.0.0-dg3
    restart: unless-stopped
    env_file: [ "${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/secrets/superset.env" ]   # kunci & sandi DB (tidak di git)
    volumes:
      - ${LDG_DATA_DIR:-/home/ubuntu/data-governance/data}/superset:/app/superset_home        # cache (uid 1000)
    depends_on:
      postgresql: { condition: service_healthy }
    networks: [ldg-internal, ldg-egress]   # egress: Trino datahub.len.co.id:443 · UI hanya via gateway :8585/visualisasi/
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/visualisasi/health"]
      interval: 20s
      timeout: 10s
      retries: 30

networks:
  ldg-internal:
    internal: true
    ipam: { config: [ { subnet: 172.28.10.0/24 } ] }
  ldg-egress:
    ipam: { config: [ { subnet: 172.28.11.0/24 } ] }
