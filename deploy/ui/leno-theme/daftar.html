<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Governance</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/_leno/leno.css">
<style>
  body { margin: 0; background: var(--uix-surface-page); color: var(--uix-text-body); font-family: var(--uix-font); }
  .dg-wrap { max-width: none; margin: 0 auto; padding: 24px 16px 48px; }
  .dg-crumb { font-size: 13px; color: var(--uix-text-secondary); margin-bottom: 12px; }
  .dg-crumb a { color: inherit; }
  .dg-head h1 { margin: 0 0 4px; font-size: 22px; color: var(--uix-text-head); font-weight: 600; }
  .dg-head p { margin: 0; font-size: 14px; color: var(--uix-text-secondary); line-height: 1.6; max-width: 720px; }
  .dg-card { background: var(--uix-surface); border: 1px solid var(--uix-border); border-radius: var(--uix-radius-md); box-shadow: var(--uix-shadow-xs); margin-top: 20px; }
  .dg-toolbar { display: flex; gap: 12px; padding: 16px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--uix-border); }
  .dg-toolbar input { height: var(--uix-control-md); border: 1px solid var(--uix-field-border); border-radius: var(--uix-radius); padding: 0 10px; font: inherit; font-size: 14px; background: var(--uix-surface); color: var(--uix-text-body); min-width: 240px; flex: 1; }
  .dg-count { margin-left: auto; font-size: 13px; color: var(--uix-text-secondary); }
  .dg-table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--uix-border-subtle); vertical-align: top; }
  th { color: var(--uix-text-secondary); font-weight: 600; background: var(--uix-surface-subtle); white-space: nowrap; }
  td.id { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--uix-text-secondary); white-space: nowrap; }
  .dg-chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #EDF0F4; color: #3A4658; white-space: nowrap; }
  .dg-chip.mn { background: #FCE8E9; color: #8E1418; }
  .dg-empty { padding: 32px; text-align: center; color: var(--uix-text-secondary); }
  .dg-note { margin-top: 12px; font-size: 12px; color: var(--uix-text-muted); }
  .dg-toolbar-top { display: flex; flex-wrap: nowrap; align-items: center; gap: 12px; margin: 0 0 16px; padding: 0; border: 0; }
  .dg-toolbar-top input { flex: 1 1 auto; min-width: 200px; height: var(--uix-control-md); }
  .dg-toolbar-top select { flex: 0 1 auto; width: auto; min-width: 150px; height: var(--uix-control-md); }
  .dg-toolbar-top .dg-count { margin-left: auto; white-space: nowrap; }
  .dg-add { margin: 0 0 12px; padding: 16px 20px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; }
  .dg-add form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 16px; }
  .dg-add label { display: block; font-size: 13px; font-weight: 500; color: #101828; margin-bottom: 4px; }
  .dg-add .f { margin-bottom: 12px; }
  .dg-add input, .dg-add select { width: 100%; box-sizing: border-box; height: 34px; border: 1px solid #99a1af; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 14px; }
  .dg-add .wide { grid-column: 1 / -1; }
  .dg-add .err { color: #8E1418; font-size: 12px; min-height: 14px; }
  .dg-add footer { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }
  .dg-add[hidden] { display: none; }
  @media (max-width: 600px) { .dg-wrap { padding: 16px; } .dg-toolbar input { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<main class="dg-wrap">
  <div class="dg-crumb" id="crumb"></div>
<div class="dg-toolbar dg-toolbar-top">
      <input id="q" type="search" placeholder="Cari…" aria-label="Cari">
      <span class="dg-count" id="count"></span>
    </div>
  <section class="dg-head"><h1 id="judul"></h1><p id="ket"></p></section>
  <div class="dg-add" id="add" hidden><form id="af" novalidate><div class="f"><label for="a-tbl">TABLE_ID (Objek) <span class="dg-chip">Otomatis dari DB</span></label><select id="a-tbl"></select><div class="err" id="e-tbl"></div></div><div class="f"><label for="a-col">Nama kolom <span class="dg-chip manual">Manual</span></label><input id="a-col" maxlength="200"><div class="err" id="e-col"></div></div><div class="f"><label for="a-bt">Business term <span class="dg-chip">Otomatis dari master</span></label><select id="a-bt"></select></div><div class="f"><label for="a-dt">Tipe data <span class="dg-chip manual">Manual</span></label><input id="a-dt" maxlength="200" placeholder="contoh Text, Enum, Number"><div class="err" id="e-dt"></div></div><div class="f wide"><label for="a-al">Alasan perubahan</label><input id="a-al" maxlength="500"></div><footer><button class="ant-btn ant-btn-default" type="button" id="a-cancel"><span>Batal</span></button><button class="ant-btn ant-btn-primary" type="button" id="a-save"><span>Simpan</span></button></footer><div class="err wide" id="e-srv"></div></form></div>
  <section class="dg-card">
    
    <div class="dg-table-wrap">
      <table><thead id="thead"></thead><tbody id="rows"></tbody></table>
      <div class="dg-empty" id="empty" hidden></div>
    </div>
  </section>
  <p class="dg-note">Data hanya dibaca dari Trino. Perubahan dilakukan di sumber masing-masing.</p>
</main>
<script src="/_leno/shell.js"></script>
<script>
(function () {
  var CFG = {
    elemen:     { key: 'elemen',     grup: 'Katalog data', judul: 'Data Element', ket: 'Kolom tabel, tipe data, dan business term. Dibaca dari silver_dim_meta_field.' },
    assignment: { key: 'assignment', grup: 'Tata kelola', judul: 'Governance Assignment', ket: 'Data Owner, Data Steward, dan Data User untuk setiap FIELD_ID.' },
    kualitas:   { key: 'kualitas',   grup: 'Tata kelola', judul: 'Data Quality Rules', ket: 'Aturan dan validasi kualitas data per FIELD_ID.' },
    lineage:    { key: 'lineage',    grup: 'Tata kelola', judul: 'Data Flow Lineage', ket: 'Ke layar, laporan, atau sistem mana data mengalir.' },
    akses:      { key: 'akses',      grup: 'Tata kelola', judul: 'Security Access', ket: 'Hak akses unit kerja untuk setiap alur data.' }
  };
  var path = location.pathname.replace(/\/$/, '').split('/').pop();
  var c = CFG[path] || CFG.elemen;
  document.title = c.judul + ' · Data Governance';
  document.getElementById('crumb').innerHTML = '<a href="/">Beranda</a> › ' + c.grup + ' › ' + c.judul;
  document.getElementById('judul').textContent = c.judul;
  document.getElementById('ket').textContent = c.ket;
  var all = [], cols = [], rowsEl = document.getElementById('rows'), q = document.getElementById('q');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
  function label(k) { return k.replace(/_/g, ' ').toUpperCase(); }
  function cell(v) { return v ? esc(v) : '<span class="dg-chip mn">Perlu input manual</span>'; }
  function render() {
    var t = q.value.trim().toLowerCase();
    var list = all.filter(function (r) { return !t || cols.some(function (k) { return r[k] && String(r[k]).toLowerCase().indexOf(t) >= 0; }); });
    rowsEl.innerHTML = list.slice(0, 1000).map(function (r) {
      return '<tr>' + cols.map(function (k, i) { return i === 0 ? '<td class="id">' + esc(r[k]) + '</td>' : '<td>' + cell(r[k]) + '</td>'; }).join('') + '</tr>';
    }).join('');
    document.getElementById('empty').hidden = list.length > 0;
    document.getElementById('empty').textContent = 'Tidak ada data yang cocok.';
    document.getElementById('count').textContent = list.length + ' dari ' + all.length + ' baris' + (list.length > 1000 ? ' (menampilkan 1000 pertama)' : '');
  }
  fetch('/_export/daftar/' + c.key, { credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      all = j.rows || []; cols = j.kolom || [];
      document.getElementById('thead').innerHTML = '<tr>' + cols.map(function (k) { return '<th>' + esc(label(k)) + '</th>'; }).join('') + '</tr>';
      render();
    })
    .catch(function () { document.getElementById('empty').hidden = false; document.getElementById('empty').textContent = 'Data belum dapat dimuat. Coba lagi sebentar.'; });

  /* Tambah Data Element (hanya admin/UV-1): form di atas tabel, TABLE_ID dari Objek, business term dari Glosarium. */
  if (c.key === 'elemen') {
    var addBtn = document.createElement('button');
    addBtn.id = 'a-open'; addBtn.type = 'button'; addBtn.className = 'ant-btn ant-btn-primary'; addBtn.hidden = true;
    addBtn.innerHTML = '<span>Tambah Data Element</span>';
    var bar = document.querySelector('.dg-toolbar-top'); if (bar) bar.appendChild(addBtn);
    var A = function (id) { return document.getElementById(id); };
    addBtn.addEventListener('click', function () { A('add').hidden = false; A('af').reset(); A('e-srv').textContent = ''; A('a-col').focus(); });
    A('a-cancel').addEventListener('click', function () { A('add').hidden = true; });
    fetch('/_export/whoami', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : {}; }).then(function (j) { addBtn.hidden = !j.bisa_ubah; });
    Promise.all([fetch('/_export/objek', { credentials: 'same-origin' }).then(function (r) { return r.json(); }),
                 fetch('/_export/glosarium', { credentials: 'same-origin' }).then(function (r) { return r.json(); })]).then(function (x) {
      A('a-tbl').innerHTML = '<option value="">Pilih tabel</option>' + x[0].rows.map(function (r) { return '<option value="' + r.table_id + '">' + r.table_id + ' · ' + (r.table_name || '') + '</option>'; }).join('');
      A('a-bt').innerHTML = '<option value="">(tanpa business term)</option>' + x[1].rows.filter(function (r) { return r.business_term; }).map(function (r) { return '<option>' + r.business_term + '</option>'; }).join('');
    });
    A('a-save').addEventListener('click', function () {
      var body = { table_id: A('a-tbl').value, column_name: A('a-col').value.trim(), business_term: A('a-bt').value, data_type: A('a-dt').value.trim(), alasan: A('a-al').value.trim() };
      A('e-tbl').textContent = body.table_id ? '' : 'Pilih TABLE_ID.';
      A('e-col').textContent = body.column_name ? '' : 'Nama kolom wajib diisi.';
      A('e-dt').textContent = body.data_type ? '' : 'Tipe data wajib diisi.';
      if (!body.table_id || !body.column_name || !body.data_type) return;
      fetch('/_export/elemen', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) { A('e-srv').textContent = res.j.error || 'Belum dapat disimpan.'; return; }
          A('add').hidden = true; A('e-srv').textContent = '';
          location.reload();
        });
    });
  }

  /* Tambah seragam untuk layar Tata kelola dan Akses: tombol di baris pencarian, form di atas tabel (gaya sama dengan Data Element). */
  var SPECF = {
    assignment: { name: 'Governance Assignment', fields: [['field_id','select','elemen','FIELD_ID','Otomatis dari master'],['role','select','role','Peran','Manual'],['org_id','select','org','ORG_ID','Otomatis dari DB']] },
    kualitas: { name: 'Data Quality Rule', fields: [['field_id','select','elemen','FIELD_ID','Otomatis dari master'],['rule','text','','Aturan','Manual'],['validation','text','','Validasi','Manual']] },
    lineage: { name: 'Data Flow Lineage', fields: [['field_id','select','elemen','FIELD_ID','Otomatis dari master'],['target_label','text','','Target (layar/laporan)','Manual'],['asset_type','text','','Jenis aset','Manual']] },
    akses: { name: 'Security Access', fields: [['field_id','select','elemen','FIELD_ID','Otomatis dari master'],['org_id','select','org','ORG_ID','Otomatis dari DB'],['classification','text','','Klasifikasi','Manual'],['permission_category','text','','Kategori izin','Manual'],['permission_type','text','','Jenis izin','Manual']] }
  };
  if (SPECF[c.key]) {
    var cfg = SPECF[c.key], B = function (id) { return document.getElementById(id); };
    var box = document.createElement('div'); box.className = 'dg-add'; box.id = 'add'; box.hidden = true;
    var fieldsHtml = cfg.fields.map(function (f) {
      var inp = f[1] === 'select' ? '<select id="x-' + f[0] + '"></select>' : '<input id="x-' + f[0] + '" maxlength="200">';
      var chip = f[4].indexOf('Manual') >= 0 ? 'manual' : '';
      return '<div class="f"><label for="x-' + f[0] + '">' + f[3] + ' <span class="dg-chip ' + chip + '">' + f[4] + '</span></label>' + inp + '<div class="err" id="e-' + f[0] + '"></div></div>';
    }).join('');
    box.innerHTML = '<form id="af" novalidate>' + fieldsHtml +
      '<div class="f wide"><label for="x-alasan">Alasan perubahan</label><input id="x-alasan" maxlength="500"></div>' +
      '<footer><button class="ant-btn ant-btn-default" type="button" id="a-cancel"><span>Batal</span></button><button class="ant-btn ant-btn-primary" type="button" id="a-save"><span>Simpan</span></button></footer>' +
      '<div class="err wide" id="e-srv"></div></form>';
    var anchor = document.querySelector('.dg-toolbar-top') || document.querySelector('.dg-card');
    anchor.parentNode.insertBefore(box, anchor.nextSibling);
    var addBtn = document.createElement('button'); addBtn.id = 'a-open'; addBtn.type = 'button'; addBtn.className = 'ant-btn ant-btn-primary'; addBtn.hidden = true;
    addBtn.innerHTML = '<span>Tambah ' + cfg.name + '</span>';
    var bar = document.querySelector('.dg-toolbar-top'); if (bar) bar.appendChild(addBtn);
    var lists = {};
    function fill(sel, vals) { var e = B('x-' + sel); e.innerHTML = '<option value="">Pilih</option>' + vals.map(function (v) { return '<option>' + v + '</option>'; }).join(''); }
    fetch('/_export/daftar/elemen', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
      lists.fid = (j.rows || []).map(function (r) { return r.field_id; }).filter(Boolean); if (B('x-field_id')) fill('field_id', lists.fid);
    });
    fetch('/_export/master-organisasi', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
      lists.org = Array.from(new Set((j.rows || []).map(function (r) { return r.org_id; }).filter(Boolean))); if (B('x-org_id')) fill('org_id', lists.org);
    });
    if (B('x-role')) fill('role', ['Data Owner','Data Steward','Data User']);
    function loadOpts() {
      fetch('/_export/daftar/elemen', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
        if (B('x-field_id')) fill('field_id', (j.rows || []).map(function (r) { return r.field_id; }).filter(Boolean));
      });
      fetch('/_export/master-organisasi', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
        if (B('x-org_id')) fill('org_id', Array.from(new Set((j.rows || []).map(function (r) { return r.org_id; }).filter(Boolean))));
      });
    }
    addBtn.addEventListener('click', function () { box.hidden = false; B('af').reset(); B('e-srv').textContent = ''; loadOpts(); });
    B('a-cancel').addEventListener('click', function () { box.hidden = true; });
    fetch('/_export/whoami', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : {}; }).then(function (j) { addBtn.hidden = !j.bisa_ubah; });
    B('a-save').addEventListener('click', function () {
      var body = { alasan: B('x-alasan').value.trim() }, bad = false;
      cfg.fields.forEach(function (f) {
        var v = B('x-' + f[0]).value.trim(); body[f[0]] = v;
        B('e-' + f[0]).textContent = v ? '' : f[3] + ' wajib diisi.'; if (!v) bad = true;
      });
      if (bad) return;
      fetch('/_export/daftar/' + c.key, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) { if (!res.ok) { B('e-srv').textContent = res.j.error || 'Belum dapat disimpan.'; return; } location.reload(); });
    });
  }
  q.addEventListener('input', render);
})();
</script>
</body>
</html>
