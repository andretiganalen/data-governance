<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Governance</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/_leno/leno.css">
<style>
  body { margin: 0; background: var(--uix-surface-page); color: var(--uix-text-body); font-family: var(--uix-font); }
  .dg-wrap { max-width: none; margin: 0 auto; padding: 24px 16px 48px; }
  .dg-crumb { font-size: 13px; color: var(--uix-text-secondary); margin-bottom: 12px; }
  .dg-crumb a { color: inherit; }
  .dg-head h1 { margin: 0 0 4px; font-size: 22px; color: var(--uix-text-head); font-weight: 600; }
  .dg-head p { margin: 0; font-size: 14px; color: var(--uix-text-secondary); line-height: 1.6; max-width: 720px; }
  .dg-card { background: var(--uix-surface); border: 1px solid var(--uix-border); border-radius: var(--uix-radius-md); box-shadow: var(--uix-shadow-xs); margin-top: 20px; }
  .dg-toolbar { display: flex; gap: 12px; padding: 16px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--uix-border); }
  .dg-toolbar input { height: var(--uix-control-md); border: 1px solid var(--uix-field-border); border-radius: var(--uix-radius); padding: 0 10px; font: inherit; font-size: 14px; background: var(--uix-surface); color: var(--uix-text-body); min-width: 240px; flex: 1; }
  .dg-count { margin-left: auto; font-size: 13px; color: var(--uix-text-secondary); }
  .dg-table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--uix-border-subtle); vertical-align: top; }
  th { color: var(--uix-text-secondary); font-weight: 600; background: var(--uix-surface-subtle); white-space: nowrap; }
  td.id { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--uix-text-secondary); white-space: nowrap; }
  .dg-chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #EDF0F4; color: #3A4658; white-space: nowrap; }
  .dg-chip.mn { background: #FCE8E9; color: #8E1418; }
  .dg-empty { padding: 32px; text-align: center; color: var(--uix-text-secondary); }
  .dg-note { margin-top: 12px; font-size: 12px; color: var(--uix-text-muted); }
  @media (max-width: 600px) { .dg-wrap { padding: 16px; } .dg-toolbar input { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<main class="dg-wrap">
  <div class="dg-crumb" id="crumb"></div>
  <section class="dg-head"><h1 id="judul"></h1><p id="ket"></p></section>
  <section class="dg-card">
    <div class="dg-toolbar">
      <input id="q" type="search" placeholder="Cari…" aria-label="Cari">
      <span class="dg-count" id="count"></span>
    </div>
    <div class="dg-table-wrap">
      <table><thead id="thead"></thead><tbody id="rows"></tbody></table>
      <div class="dg-empty" id="empty" hidden></div>
    </div>
  </section>
  <p class="dg-note">Data hanya dibaca dari Trino. Perubahan dilakukan di sumber masing-masing.</p>
</main>
<script src="/_leno/shell.js"></script>
<script>
(function () {
  var CFG = {
    elemen:     { key: 'elemen',     grup: 'Katalog data', judul: 'Data Element', ket: 'Kolom tabel, tipe data, dan business term. Dibaca dari silver_dim_meta_field.' },
    assignment: { key: 'assignment', grup: 'Tata kelola', judul: 'Governance Assignment', ket: 'Data Owner, Data Steward, dan Data User untuk setiap FIELD_ID.' },
    kualitas:   { key: 'kualitas',   grup: 'Tata kelola', judul: 'Data Quality Rules', ket: 'Aturan dan validasi kualitas data per FIELD_ID.' },
    lineage:    { key: 'lineage',    grup: 'Tata kelola', judul: 'Data Flow Lineage', ket: 'Ke layar, laporan, atau sistem mana data mengalir.' },
    akses:      { key: 'akses',      grup: 'Tata kelola', judul: 'Security Access', ket: 'Hak akses unit kerja untuk setiap alur data.' }
  };
  var path = location.pathname.replace(/\/$/, '').split('/').pop();
  var c = CFG[path] || CFG.elemen;
  document.title = c.judul + ' · Data Governance';
  document.getElementById('crumb').innerHTML = '<a href="/">Beranda</a> › ' + c.grup + ' › ' + c.judul;
  document.getElementById('judul').textContent = c.judul;
  document.getElementById('ket').textContent = c.ket;
  var all = [], cols = [], rowsEl = document.getElementById('rows'), q = document.getElementById('q');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
  function label(k) { return k.replace(/_/g, ' ').toUpperCase(); }
  function cell(v) { return v ? esc(v) : '<span class="dg-chip mn">Perlu input manual</span>'; }
  function render() {
    var t = q.value.trim().toLowerCase();
    var list = all.filter(function (r) { return !t || cols.some(function (k) { return r[k] && String(r[k]).toLowerCase().indexOf(t) >= 0; }); });
    rowsEl.innerHTML = list.slice(0, 1000).map(function (r) {
      return '<tr>' + cols.map(function (k, i) { return i === 0 ? '<td class="id">' + esc(r[k]) + '</td>' : '<td>' + cell(r[k]) + '</td>'; }).join('') + '</tr>';
    }).join('');
    document.getElementById('empty').hidden = list.length > 0;
    document.getElementById('empty').textContent = 'Tidak ada data yang cocok.';
    document.getElementById('count').textContent = list.length + ' dari ' + all.length + ' baris' + (list.length > 1000 ? ' (menampilkan 1000 pertama)' : '');
  }
  fetch('/_export/daftar/' + c.key, { credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      all = j.rows || []; cols = j.kolom || [];
      document.getElementById('thead').innerHTML = '<tr>' + cols.map(function (k) { return '<th>' + esc(label(k)) + '</th>'; }).join('') + '</tr>';
      render();
    })
    .catch(function () { document.getElementById('empty').hidden = false; document.getElementById('empty').textContent = 'Data belum dapat dimuat. Coba lagi sebentar.'; });
  q.addEventListener('input', render);
})();
</script>
</body>
</html>
